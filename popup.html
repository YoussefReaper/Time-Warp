<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body {
            width: 380px;
            font-family: 'Inter', system-ui, sans-serif;
            background: rgb(20, 15, 31);
            color: rgb(243, 240, 255);
            margin: 0;
            padding: 16px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        h3 { margin: 0; color: rgb(168, 85, 247); font-size: 15px; }
        .row { margin: 10px 0; }
        label { font-size: 11px; color: rgb(185, 174, 214); display: block; margin-bottom: 4px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        select {
            width: 100%;
            background: rgba(168, 85, 247, 0.1);
            border: 1px solid rgba(139, 92, 246, 0.3);
            color: rgb(243, 240, 255);
            padding: 8px;
            border-radius: 8px;
            font-size: 12px;
        }
        button {
            width: 100%;
            background: rgb(168, 85, 247);
            color: #fff;
            border: none;
            padding: 10px;
            cursor: pointer;
            border-radius: 20px;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 12px;
            margin-top: 12px;
        }
        button:hover { background: rgb(147, 51, 234); }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        #msg { font-size: 11px; color: rgb(185, 174, 214); margin-top: 10px; min-height: 14px; }
    </style>
</head>
<body>
    <div class="header">
        <h3>Time Warp BOI</h3>
        <div style="display:flex; gap:12px; align-items:center;">
            <label style="margin:0; font-size:12px; font-weight:bold;"><input type="checkbox" id="hide-toggle"> hide slider</label>
            <label style="margin:0; font-size:12px; font-weight:bold;"><input type="checkbox" id="compare-toggle"> compare</label>
        </div>
    </div>
    <div id="compare-ui" style="display:none;">
        <div class="row">
            <label>start point</label>
            <select id="start-sel"><option value="">pick start boi</option></select>
        </div>
        <div class="row">
            <label>end point</label>
            <select id="end-sel"><option value="">pick end boi</option></select>
        </div>
        <button id="go-btn" disabled>compare boi</button>
        <div id="msg"></div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
